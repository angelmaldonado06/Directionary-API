<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dictionary API</title>
    <link href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,100..900;1,100..900&family=Calistoga&family=Faculty+Glyphic&family=Kanit:ital@1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!--Search Section-->
    <section class="p-5 d-flex flex-column justify-content-center align-items-center text-center" id="search-section">
      <h1 class="display-3 mb-3">Dictionary API Word Search</h1>
      <p class="mb-4">Search for a word to see its definition and pronunciation.</p>
      <div class="input-group align-items-center" id="word-search-form">
        <input id="word-search-input" type="text" class="form-control" placeholder="Enter a word" aria-label="Recipient's username" aria-describedby="button-addon2">
        <button class= "btn btn-success" type="button" id="search-button" onclick="getAndDisplayWordData()">Search</button>
      </div>
    </section>

    <!--Results Section-->
    <section class="p-5" id="results-section">
      <p class="text-center" id="no-word-found">Try searching for a word.</p>
      <h2 class="mb-4">
        <strong>
          <span id="word"></span>
        </strong>
        <span id="pronunciation"></span>
      </h2>
      <h5>
        <span id="definition"></span>
      </h5>
    </section>

    <footer class="text-center">&copy; Dictionary API 2023</footer>

     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
